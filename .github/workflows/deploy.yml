name: Build and Deploy Frontend

on:
  push:
    branches: [ main ]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set build variables
        run: |
          echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> $GITHUB_ENV

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build frontend image
        run: |
          docker build -t ghcr.io/${{ env.OWNER_LC }}/greyloops-web:main-latest .
          docker tag ghcr.io/${{ env.OWNER_LC }}/greyloops-web:main-latest \
            ghcr.io/${{ env.OWNER_LC }}/greyloops-web:${{ env.SHORT_SHA }}

      - name: Push images to GHCR
        run: |
          docker push ghcr.io/${{ env.OWNER_LC }}/greyloops-web:main-latest
          docker push ghcr.io/${{ env.OWNER_LC }}/greyloops-web:${{ env.SHORT_SHA }}

      - name: Trigger Portainer deployment
        run: curl -k -X POST ${{ secrets.PRODUCTION_PORTAINER_WEBHOOK }}
